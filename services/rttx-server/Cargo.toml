[package]
name = "rttx-server"
version.workspace = true
edition = "2024"
license.workspace = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
future_not_send = "allow"
redundant_pub_crate = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
too_long_first_doc_paragraph = "allow"
missing_errors_doc = "allow"
too_many_lines = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"
wildcard_imports = "allow"
unused_self = "allow"
suboptimal_flops = "warn"
todo = "warn"
dbg_macro = "warn"

[dependencies]
rttx-proto.workspace = true

# Allocator
mimalloc = "0.1"

# Protocol serialization
prost.workspace = true
bytes.workspace = true

# Async runtime
tokio = { workspace = true, features = ["full"] }
tokio-stream = "0.1"

# PTY
pty-process = { version = "0.5", features = ["async"] }

# Terminal state parsing
vte = "0.13"

# Serialization (state persistence)
serde.workspace = true
serde_json.workspace = true

# Process management
daemonix = "0.1"
nix = { version = "0.29", features = ["fs", "signal"] }
signal-hook = { version = "0.3", features = ["iterator"] }
signal-hook-tokio = { version = "0.3", features = ["futures-v0_3"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Utilities
uuid = { workspace = true, features = ["serde"] }
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
anyhow = "1"

[[bin]]
name = "pty-exerciser"
path = "src/bin/pty_exerciser.rs"

[dev-dependencies]
tempfile.workspace = true
pretty_assertions.workspace = true
tracing-test = "0.2"
proptest.workspace = true
