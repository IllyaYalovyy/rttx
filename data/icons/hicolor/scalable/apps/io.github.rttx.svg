<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3584e4"/>
      <stop offset="100%" stop-color="#1c71d8"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="4" y="4" width="120" height="120" rx="24" fill="url(#bg)"/>
  <!-- Terminal prompt symbol > -->
  <text x="28" y="82" font-family="monospace" font-size="64" font-weight="bold" fill="white">$_</text>
  <!-- Tiling grid lines -->
  <line x1="64" y1="20" x2="64" y2="108" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <line x1="20" y1="64" x2="108" y2="64" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
</svg>
