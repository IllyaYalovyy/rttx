name: Release

on:
  push:
    tags:
      - "v[0-9]*.*"

env:
  CARGO_TERM_COLOR: always

jobs:
  # Re-run quality checks on the exact tag commit before building anything.
  quality:
    name: Quality gate
    uses: ./.github/workflows/quality.yml

  build-flatpak:
    name: Build Flatpak bundle
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Install Flatpak tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            flatpak \
            flatpak-builder \
            elfutils \
            librsvg2-common

      - name: Cache Flatpak runtimes
        uses: actions/cache@v4
        with:
          path: ~/.local/share/flatpak
          key: flatpak-runtimes-gnome-49

      - name: Add Flathub remote
        run: |
          flatpak remote-add --if-not-exists --user flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install GNOME runtime and Rust extension
        run: |
          flatpak install -y --user flathub \
            org.gnome.Platform//49 \
            org.gnome.Sdk//49 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08

      - name: Build Flatpak bundle
        run: ./packaging/rttx/flatpak/build-bundle.sh

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: rttx.flatpak
          if-no-files-found: error

  build-deb:
    name: Build DEB package
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev \
            libadwaita-1-dev \
            libvte-2.91-gtk4-dev \
            protobuf-compiler

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Build release binaries
        run: |
          # vte4-sys requires vte >= 0.78 by default; fall back to the vte-0_76
          # feature when the runner ships an older vte (mirrors the quality CI).
          vte_version=$(pkg-config --modversion vte-2.91-gtk4 2>/dev/null || echo "0.78")
          if printf '%s\n' "0.78" "${vte_version}" | sort -V | head -n1 | grep -q "^0\.78"; then
            client_features=()
          else
            client_features=(--no-default-features --features vte-0_76)
          fi
          cargo build --release -p rttx-server
          cargo build --release -p rttx "${client_features[@]}"

      - name: Strip binaries
        run: strip target/release/rttx target/release/rttx-server

      - name: Build DEB
        working-directory: clients/rttx
        run: cargo deb --no-build

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: target/debian/*.deb
          if-no-files-found: error

  build-rpm:
    name: Build RPM (SRPM + Fedora binary)
    runs-on: ubuntu-latest
    needs: quality
    # Build inside Fedora so the RPM links against Fedora's GTK/VTE/glibc and
    # the SRPM is produced with Fedora's cargo-rpm-macros. The SRPM is the
    # artifact COPR rebuilds for every enabled Fedora release/arch.
    container: registry.fedoraproject.org/fedora:latest
    steps:
      - name: Install packaging toolchain
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git cargo rust rpm-build rpmdevtools dnf5-plugins xz
          # git-archive/describe must work on the runner-owned checkout.
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v4
        with:
          # Full history + tags: build-srpm.sh checks HEAD against the v<version> tag.
          fetch-depth: 0

      - name: Install spec BuildRequires
        run: dnf builddep -y packaging/rttx/rttx.spec

      - name: Build SRPM
        run: ./packaging/rttx/rpm/build-srpm.sh --outdir dist/rpm

      - name: Build binary RPM for the GitHub release
        # `--without check`: the quality gate already ran the full suite on this
        # commit, and COPR runs %check again in every chroot.
        run: |
          rpmbuild --rebuild dist/rpm/*.src.rpm --without check \
            --define "_topdir ${PWD}/dist/rpmbuild"
          find dist/rpmbuild/RPMS -name '*.rpm' -not -name '*debuginfo*' -not -name '*debugsource*' \
            -exec cp -v {} dist/rpm/ \;

      - name: Upload RPMs
        uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: |
            dist/rpm/*.src.rpm
            dist/rpm/*.x86_64.rpm
          if-no-files-found: error

  github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-flatpak, build-deb, build-rpm]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/flatpak-bundle/rttx.flatpak
            dist/deb-package/*.deb
            dist/rpm-package/*.rpm
          generate_release_notes: true

  copr-submit:
    name: Submit to Fedora COPR
    runs-on: ubuntu-latest
    needs: build-rpm
    steps:
      - name: Download RPM artifact
        uses: actions/download-artifact@v4
        with:
          name: rpm-package
          path: dist/

      - name: Install copr-cli
        run: pip install copr-cli

      # COPR rebuilds the SRPM once per chroot enabled in the project settings
      # (fedora-43/44/rawhide x86_64/aarch64, ...); the binary RPM built above
      # is only the GitHub-release convenience asset.
      - name: Submit SRPM build to COPR
        env:
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_USERNAME: ${{ secrets.COPR_USERNAME }}
          COPR_TOKEN: ${{ secrets.COPR_TOKEN }}
          COPR_PROJECT: ${{ vars.COPR_PROJECT || 'etf2026/rttx' }}
        run: |
          if [ -z "${COPR_TOKEN}" ]; then
            echo "COPR secrets are not configured; skipping COPR submission."
            echo "Set COPR_LOGIN, COPR_USERNAME and COPR_TOKEN to enable it."
            exit 0
          fi
          mkdir -p ~/.config
          cat > ~/.config/copr <<EOF
          [copr-cli]
          login = ${COPR_LOGIN}
          username = ${COPR_USERNAME}
          token = ${COPR_TOKEN}
          copr_url = https://copr.fedorainfracloud.org
          EOF
          copr-cli build --nowait "${COPR_PROJECT}" dist/*.src.rpm
