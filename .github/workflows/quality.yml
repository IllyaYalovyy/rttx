name: Quality

on:
  push:
    branches: [mainline]
  pull_request:
    branches: [mainline]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: rttx

      - name: Read pinned rttxd ref
        id: rttxd-ref
        run: echo "ref=$(tr -d '\n' < rttx/.github/rttxd-ref)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          repository: IllyaYalovyy/rttxd
          ref: ${{ steps.rttxd-ref.outputs.ref }}
          path: rttxd

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        working-directory: rttx
        run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install toolchain and dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git gcc pkg-config rustup \
            protobuf-compiler protobuf-devel \
            gtk4-devel libadwaita-devel vte291-gtk4-devel

      - uses: actions/checkout@v5
        with:
          path: rttx

      - name: Read pinned rttxd ref
        id: rttxd-ref
        run: echo "ref=$(tr -d '\n' < rttx/.github/rttxd-ref)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          repository: IllyaYalovyy/rttxd
          ref: ${{ steps.rttxd-ref.outputs.ref }}
          path: rttxd

      - name: Setup Rust
        env:
          RUSTUP_HOME: /usr/local/rustup
          CARGO_HOME: /usr/local/cargo
        run: |
          rustup-init -y --default-toolchain stable --component clippy
          echo "/usr/local/cargo/bin" >> "$GITHUB_PATH"

      - name: Clippy
        env:
          RUSTUP_HOME: /usr/local/rustup
          CARGO_HOME: /usr/local/cargo
        working-directory: rttx
        run: |
          bash .github/scripts/ensure-sibling-rttxd.sh
          cargo clippy -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install toolchain and dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git gcc pkg-config rustup \
            protobuf-compiler protobuf-devel \
            gtk4-devel libadwaita-devel vte291-gtk4-devel

      - uses: actions/checkout@v5
        with:
          path: rttx

      - name: Read pinned rttxd ref
        id: rttxd-ref
        run: echo "ref=$(tr -d '\n' < rttx/.github/rttxd-ref)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          repository: IllyaYalovyy/rttxd
          ref: ${{ steps.rttxd-ref.outputs.ref }}
          path: rttxd

      - name: Setup Rust
        env:
          RUSTUP_HOME: /usr/local/rustup
          CARGO_HOME: /usr/local/cargo
        run: |
          rustup-init -y --default-toolchain stable
          echo "/usr/local/cargo/bin" >> "$GITHUB_PATH"

      - name: Run tests
        env:
          RUSTUP_HOME: /usr/local/rustup
          CARGO_HOME: /usr/local/cargo
        working-directory: rttx
        run: bash .github/scripts/run-quality-tests.sh

  manifest:
    name: Flatpak manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: rttx

      - name: Validate Flatpak manifest JSON
        working-directory: rttx
        run: python3 -m json.tool io.github.IllyaYalovyy.rttx.json > /dev/null
