name: Quality

on:
  push:
    branches: [mainline]
  pull_request:
    branches: [mainline]
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  runtime-behavior-gate:
    name: Runtime behavior gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Test runtime behavior gate
        run: python3 -m unittest discover -s .github/scripts/tests -p 'test_*.py'

      - name: Enforce runtime behavior coverage
        if: github.event_name == 'pull_request'
        run: |
          python3 .github/scripts/check_runtime_behavior_policy.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}"

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

      - name: Check version consistency
        run: bash .github/scripts/check-version-consistency.sh

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install toolchain and dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git gcc pkg-config rustup \
            protobuf-compiler protobuf-devel \
            gtk4-devel libadwaita-devel vte291-gtk4-devel

      - uses: actions/checkout@v5

      - name: Setup Rust
        env:
          RUSTUP_HOME: /usr/local/rustup
          CARGO_HOME: /usr/local/cargo
        run: |
          rustup-init -y --default-toolchain stable --component clippy
          echo "/usr/local/cargo/bin" >> "$GITHUB_PATH"

      - name: Clippy
        env:
          RUSTUP_HOME: /usr/local/rustup
          CARGO_HOME: /usr/local/cargo
        run: bash .github/scripts/run-clippy.sh

  test:
    name: Test
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install toolchain and dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git gcc pkg-config rustup \
            protobuf-compiler protobuf-devel \
            gtk4-devel libadwaita-devel vte291-gtk4-devel

      - uses: actions/checkout@v5

      - name: Setup Rust
        env:
          RUSTUP_HOME: /usr/local/rustup
          CARGO_HOME: /usr/local/cargo
        run: |
          rustup-init -y --default-toolchain stable
          echo "/usr/local/cargo/bin" >> "$GITHUB_PATH"

      - name: Run tests
        env:
          RUSTUP_HOME: /usr/local/rustup
          CARGO_HOME: /usr/local/cargo
        run: bash .github/scripts/run-quality-tests.sh

  ui-test:
    name: UI behavioral tests
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install toolchain and dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git gcc pkg-config rustup \
            protobuf-compiler protobuf-devel \
            gtk4-devel libadwaita-devel vte291-gtk4-devel \
            weston python3-gobject at-spi2-core at-spi2-atk \
            dbus-daemon

      - uses: actions/checkout@v5

      - name: Setup Rust
        env:
          RUSTUP_HOME: /usr/local/rustup
          CARGO_HOME: /usr/local/cargo
        run: |
          rustup-init -y --default-toolchain stable
          echo "/usr/local/cargo/bin" >> "$GITHUB_PATH"

      - name: Build workspace
        env:
          RUSTUP_HOME: /usr/local/rustup
          CARGO_HOME: /usr/local/cargo
        run: cargo build --workspace

      - name: Run UI tests
        env:
          RUSTUP_HOME: /usr/local/rustup
          CARGO_HOME: /usr/local/cargo
        run: |
          dbus-run-session -- ./run_ui_tests.sh

  coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install toolchain and dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git gcc pkg-config rustup \
            protobuf-compiler protobuf-devel \
            gtk4-devel libadwaita-devel vte291-gtk4-devel

      - uses: actions/checkout@v5

      - name: Setup Rust
        env:
          RUSTUP_HOME: /usr/local/rustup
          CARGO_HOME: /usr/local/cargo
        run: |
          rustup-init -y --default-toolchain stable
          echo "/usr/local/cargo/bin" >> "$GITHUB_PATH"

      - name: Install cargo-llvm-cov
        env:
          RUSTUP_HOME: /usr/local/rustup
          CARGO_HOME: /usr/local/cargo
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --locked

      - name: Generate coverage
        env:
          RUSTUP_HOME: /usr/local/rustup
          CARGO_HOME: /usr/local/cargo
        run: bash .github/scripts/run-coverage.sh

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/lcov.info
            coverage/summary.txt

  manifest:
    name: Flatpak manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate Flatpak manifest JSON
        run: python3 -m json.tool packaging/rttx/io.github.IllyaYalovyy.rttx.json > /dev/null
