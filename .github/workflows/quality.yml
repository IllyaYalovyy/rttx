name: Quality

on:
  push:
    branches: [mainline]
  pull_request:
    branches: [mainline]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install toolchain and dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git gcc pkg-config rustup \
            gtk4-devel libadwaita-devel vte291-gtk4-devel

      - uses: actions/checkout@v4

      - name: Setup Rust
        env:
          RUSTUP_HOME: /usr/local/rustup
          CARGO_HOME: /usr/local/cargo
        run: |
          rustup-init -y --default-toolchain stable --component clippy
          echo "/usr/local/cargo/bin" >> "$GITHUB_PATH"

      - name: Clippy
        env:
          RUSTUP_HOME: /usr/local/rustup
          CARGO_HOME: /usr/local/cargo
        run: cargo clippy -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install toolchain and dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git gcc pkg-config rustup \
            gtk4-devel gtk4 libadwaita-devel vte291-gtk4-devel

      - uses: actions/checkout@v4

      - name: Setup Rust
        env:
          RUSTUP_HOME: /usr/local/rustup
          CARGO_HOME: /usr/local/cargo
        run: |
          rustup-init -y --default-toolchain stable
          echo "/usr/local/cargo/bin" >> "$GITHUB_PATH"

      - name: Start Broadway display server
        run: |
          gtk4-broadwayd :0 &
          sleep 1

      - name: Run tests
        env:
          GDK_BACKEND: broadway
          GTK_A11Y: none
          RUSTUP_HOME: /usr/local/rustup
          CARGO_HOME: /usr/local/cargo
        run: cargo test -- --test-threads=1

  manifest:
    name: Flatpak manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Flatpak manifest JSON
        run: python3 -m json.tool io.github.IllyaYalovyy.rttx.json > /dev/null
