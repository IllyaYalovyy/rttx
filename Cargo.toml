[package]
name = "rttx"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "A tiling terminal emulator for GNOME"
authors = ["Yaroslav Yalovyi"]

[dependencies]
gtk4 = { version = "0.9", features = ["v4_14"] }
libadwaita = { version = "0.7", features = ["v1_5"] }
vte4 = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
log = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
gettext-rs = { version = "0.7", features = ["gettext-system"] }
once_cell = "1"

[dev-dependencies]
tempfile = "3"
pretty_assertions = "1"
rstest = "0.23"
proptest = "1"
