syntax = "proto3";
package rttx.v3;

// ─── Enums ───────────────────────────────────────────────────────────

enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
  // Core (required) — values 1–99
  CORE_WORKSPACE_LIFECYCLE = 1;
  CORE_PANE_LIFECYCLE = 2;
  CORE_TERMINAL_IO = 3;
  CORE_TERMINAL_MODES = 4;
  CORE_PASTE_INTENT = 5;
  CORE_FOCUS_EVENTS = 6;
  // Optional — values 100+
  OPT_WORKSPACE_INVENTORY = 100;
  OPT_WORKSPACE_TAKEOVER = 101;
  OPT_RESYNC = 102;
  OPT_CHUNKED_SCROLLBACK = 103;
  OPT_DIAGNOSTICS = 104;
}

enum WorkspacePolicy {
  WORKSPACE_POLICY_UNSPECIFIED = 0;
  WORKSPACE_POLICY_PERSISTENT = 1;
  WORKSPACE_POLICY_EPHEMERAL = 2;
}

enum WorkspaceAttachMode {
  WORKSPACE_ATTACH_MODE_UNSPECIFIED = 0;
  WORKSPACE_ATTACH_MODE_READ_WRITE = 1;
  WORKSPACE_ATTACH_MODE_READ_ONLY = 2;
}

enum WorkspaceClientRole {
  WORKSPACE_CLIENT_ROLE_UNSPECIFIED = 0;
  WORKSPACE_CLIENT_ROLE_UNATTACHED = 1;
  WORKSPACE_CLIENT_ROLE_WRITER = 2;
  WORKSPACE_CLIENT_ROLE_READER = 3;
}

enum WorkspaceTerminationReason {
  WORKSPACE_TERMINATION_REASON_UNSPECIFIED = 0;
  WORKSPACE_TERMINATION_REASON_EXPLICIT = 1;
  WORKSPACE_TERMINATION_REASON_EPHEMERAL_DETACH = 2;
}

enum MouseMode {
  MOUSE_MODE_NONE = 0;
  MOUSE_MODE_X10 = 1;
  MOUSE_MODE_NORMAL = 2;
  MOUSE_MODE_BUTTON = 3;
  MOUSE_MODE_ANY = 4;
}

enum ErrorKind {
  ERROR_KIND_UNSPECIFIED = 0;
  ERROR_KIND_PROTOCOL_MISMATCH = 1;
  ERROR_KIND_UNSUPPORTED_CAPABILITY = 2;
  ERROR_KIND_INVALID_ARGUMENT = 3;
  ERROR_KIND_WORKSPACE_NOT_FOUND = 4;
  ERROR_KIND_PANE_NOT_FOUND = 5;
  ERROR_KIND_OWNERSHIP_CONFLICT = 6;
  ERROR_KIND_TAKEOVER_REQUIRED = 7;
  ERROR_KIND_STREAM_OVERFLOW = 8;
  ERROR_KIND_INTERNAL = 9;
}

// ─── Handshake (bare messages, exchanged before envelopes) ───────────

message ClientHello {
  uint32 min_protocol_version = 1;
  uint32 max_protocol_version = 2;
  bytes client_id = 3;
  string client_name = 4;
  string client_version = 5;
  repeated Capability capabilities = 6;
}

message ServerHello {
  uint32 negotiated_protocol_version = 1;
  bytes server_id = 2;
  string server_version = 3;
  repeated Capability capabilities = 4;
}

// ─── Terminal mode state ─────────────────────────────────────────────

message TerminalModeState {
  bool bracketed_paste = 1;
  bool focus_reporting = 2;
  bool application_cursor_keys = 3;
  bool application_keypad = 4;
  bool alternate_screen = 5;
  bool cursor_hidden = 6;
  MouseMode mouse_mode = 7;
  bool sgr_mouse = 8;
}

// ─── Terminal I/O ────────────────────────────────────────────────────

message TerminalInput {
  bytes runtime_id = 1;
  bytes pane_id = 2;
  oneof kind {
    RawInput raw = 3;
    PasteInput paste = 4;
    FocusInput focus = 5;
  }
}

message RawInput {
  bytes data = 1;
}

message PasteInput {
  bytes text = 1;
}

message FocusInput {
  bool focused = 1;
}

message OutputDelta {
  bytes runtime_id = 1;
  bytes pane_id = 2;
  bytes data = 3;
  uint64 pane_output_seq = 4;
}

message TerminalModeChanged {
  bytes runtime_id = 1;
  bytes pane_id = 2;
  uint64 workspace_revision = 3;
  TerminalModeState modes = 4;
}

// ─── Control ─────────────────────────────────────────────────────────

message Ping {
  uint64 nonce = 1;
}

message Pong {
  uint64 nonce = 1;
}

message Shutdown {}

// ─── Workspace lifecycle — commands ────────────────────────────────────

message CreateWorkspace {
  string name = 1;
  WorkspacePolicy policy = 2;
}

message AttachWorkspace {
  bytes runtime_id = 1;
  WorkspaceAttachMode attach_mode = 2;
}

message DetachWorkspace {
  bytes runtime_id = 1;
}

message TerminateWorkspace {
  bytes runtime_id = 1;
}

message RenameWorkspace {
  bytes runtime_id = 1;
  string name = 2;
}

message ListWorkspaces {}

// ─── Workspace lifecycle — events ──────────────────────────────────────

message WorkspaceCreated {
  bytes runtime_id = 1;
  uint64 workspace_revision = 2;
}

message WorkspaceDetached {
  bytes runtime_id = 1;
  uint64 workspace_revision = 2;
}

message WorkspaceTerminated {
  bytes runtime_id = 1;
  uint64 final_revision = 2;
  WorkspaceTerminationReason reason = 3;
}

message WorkspaceRenamed {
  bytes runtime_id = 1;
  string name = 2;
  uint64 workspace_revision = 3;
}

message AttachBlocked {
  bytes runtime_id = 1;
  WorkspaceClientRole current_client_role = 2;
  uint32 attached_client_count = 3;
  uint32 read_only_client_count = 4;
}

// ─── Workspace takeover (OPT_WORKSPACE_TAKEOVER) ─────────────────────────

message TakeoverWorkspace {
  bytes runtime_id = 1;
}

message TakeoverCompleted {
  bytes runtime_id = 1;
  uint64 workspace_revision = 2;
}

message LeaseLost {
  bytes runtime_id = 1;
  uint64 workspace_revision = 2;
  bytes new_owner_id = 3;
}

message OwnerDisconnected {
  bytes runtime_id = 1;
  uint64 workspace_revision = 2;
}

// ─── Workspace inventory ───────────────────────────────────────────────

message WorkspaceList {
  repeated WorkspaceInfo workspaces = 1;
}

message WorkspaceInfo {
  bytes id = 1;
  string name = 2;
  WorkspacePolicy policy = 3;
  uint32 pane_count = 4;
  bool has_write_owner = 5;
  uint32 read_only_client_count = 6;
  WorkspaceClientRole current_client_role = 7;
  uint64 workspace_revision = 8;
  bool reconstructed = 9;
  // OPT_WORKSPACE_INVENTORY fields
  string active_pane_summary = 10;
  bool takeover_eligible = 11;
  string disabled_reason = 12;
  repeated PaneInfo panes = 13;
  // True when the workspace name was set by an explicit user rename rather
  // than by a client-side automatic name (RFC-031, issue #1084).
  bool user_renamed = 14;
}

message PaneInfo {
  bytes id = 1;
  string title = 2;
  string cwd = 3;
  uint32 cols = 4;
  uint32 rows = 5;
  optional int32 exit_status = 6;
  bool reconstructed = 7;
  bool no_persist = 8;
}

// ─── Workspace tree (RFC-031 §2, §5) ─────────────────────────────────

// Orientation of a split node in the authoritative workspace tree.
enum PaneSplitAxis {
  PANE_SPLIT_AXIS_UNSPECIFIED = 0;
  // Children placed side by side (a vertical divider between them).
  PANE_SPLIT_AXIS_HORIZONTAL = 1;
  // Children stacked top and bottom (a horizontal divider between them).
  PANE_SPLIT_AXIS_VERTICAL = 2;
}

// One step when addressing a split node by its path from the tree root.
enum PaneTreeSide {
  PANE_TREE_SIDE_UNSPECIFIED = 0;
  PANE_TREE_SIDE_FIRST = 1;
  PANE_TREE_SIDE_SECOND = 2;
}

// A node in the server-authoritative pane tree: either a leaf naming one
// pane or a split joining two subtrees with a logical ratio.
message PaneTreeNode {
  oneof node {
    PaneTreeLeaf leaf = 1;
    PaneTreeSplit split = 2;
  }
}

message PaneTreeLeaf {
  bytes pane_id = 1;
}

message PaneTreeSplit {
  PaneSplitAxis axis = 1;
  // Fraction of space allocated to `first`, in the open interval (0, 1).
  float ratio = 2;
  PaneTreeNode first = 3;
  PaneTreeNode second = 4;
}

// ─── Snapshots ───────────────────────────────────────────────────────

message WorkspaceSnapshot {
  bytes runtime_id = 1;
  uint64 workspace_revision = 2;
  WorkspaceClientRole client_role = 3;
  repeated PaneSnapshot panes = 4;
  // Authoritative workspace structure (RFC-031). Absent only for an empty
  // workspace with no panes.
  PaneTreeNode tree = 5;
  // Fallback focus pane for a fresh attach (RFC-031 §2). Empty when the
  // workspace has no panes.
  bytes default_active_pane_id = 6;
}

message PaneSnapshot {
  bytes pane_id = 1;
  uint64 pane_output_seq = 2;
  string title = 3;
  string cwd = 4;
  uint32 cols = 5;
  uint32 rows = 6;
  optional int32 exit_status = 7;
  TerminalModeState terminal_modes = 8;
  bytes scrollback_tail = 9;
  uint64 total_scrollback_bytes = 10;
  bool scrollback_complete = 11;
}

// ─── Pane lifecycle — commands ───────────────────────────────────────

message CreatePane {
  bytes runtime_id = 1;
  optional string cwd = 2;
  optional bool dark_background = 3;
  uint32 cols = 4;
  uint32 rows = 5;
  optional bool no_persist = 6;
}

message ClosePane {
  bytes runtime_id = 1;
  bytes pane_id = 2;
}

message ResizePane {
  bytes runtime_id = 1;
  bytes pane_id = 2;
  uint32 cols = 3;
  uint32 rows = 4;
}

message SetPaneTitle {
  bytes runtime_id = 1;
  bytes pane_id = 2;
  string title = 3;
}

message SetPaneNoPersist {
  bytes runtime_id = 1;
  bytes pane_id = 2;
  bool no_persist = 3;
}

// ─── Tree mutations (RFC-031 §5) ─────────────────────────────────────
//
// Structural mutations are server-authoritative: the server applies them to
// the workspace tree, persists the result, and reports a tree delta. Pane
// identity is always server-assigned (RFC-031 G1).

// Split the leaf holding `target_pane_id`, adding a server-minted pane as the
// second child. Replaces the client-identity CreatePane for tree growth.
message SplitPane {
  bytes runtime_id = 1;
  bytes target_pane_id = 2;
  PaneSplitAxis axis = 3;
  // Fraction of space allocated to the existing pane, in (0, 1).
  float ratio = 4;
  optional string cwd = 5;
  optional bool dark_background = 6;
  uint32 cols = 7;
  uint32 rows = 8;
  optional bool no_persist = 9;
}

// Set the logical ratio of the split addressed by `path` from the tree root.
message ResizeSplit {
  bytes runtime_id = 1;
  repeated PaneTreeSide path = 2;
  float ratio = 3;
}

// ─── Viewport messages (RFC-031 §3–§5) ───────────────────────────────
//
// Per-client viewport state. SetFocus updates the server's fallback focus
// (default-active) pane; ReportClientSize drives the multi-client PTY
// min-size policy (RFC-031 §4).

message SetFocus {
  bytes runtime_id = 1;
  bytes pane_id = 2;
}

message ClientPaneSize {
  bytes pane_id = 1;
  uint32 cols = 2;
  uint32 rows = 3;
}

message ReportClientSize {
  bytes runtime_id = 1;
  repeated ClientPaneSize panes = 2;
}

// ─── Pane lifecycle — events ─────────────────────────────────────────

message PaneCreated {
  bytes runtime_id = 1;
  bytes pane_id = 2;
  uint64 workspace_revision = 3;
}

message PaneClosed {
  bytes runtime_id = 1;
  bytes pane_id = 2;
  uint64 workspace_revision = 3;
}

message PaneResized {
  bytes runtime_id = 1;
  bytes pane_id = 2;
  uint32 cols = 3;
  uint32 rows = 4;
  uint64 workspace_revision = 5;
}

message PaneExited {
  bytes runtime_id = 1;
  bytes pane_id = 2;
  int32 status = 3;
  uint64 workspace_revision = 4;
}

message TitleChanged {
  bytes runtime_id = 1;
  bytes pane_id = 2;
  string title = 3;
  uint64 workspace_revision = 4;
}

message CwdChanged {
  bytes runtime_id = 1;
  bytes pane_id = 2;
  string cwd = 3;
  uint64 workspace_revision = 4;
}

message Bell {
  bytes runtime_id = 1;
  bytes pane_id = 2;
}

// ─── Tree mutation events (RFC-031 §5) ───────────────────────────────

// A split was applied to the workspace tree. The new pane id is
// server-assigned; the target/axis/ratio describe where it landed.
message PaneSplit {
  bytes runtime_id = 1;
  bytes target_pane_id = 2;
  bytes new_pane_id = 3;
  PaneSplitAxis axis = 4;
  float ratio = 5;
  uint64 workspace_revision = 6;
}

// A split's logical ratio changed.
message SplitResized {
  bytes runtime_id = 1;
  repeated PaneTreeSide path = 2;
  float ratio = 3;
  uint64 workspace_revision = 4;
}

// The fallback focus (default-active) pane changed.
message FocusChanged {
  bytes runtime_id = 1;
  bytes pane_id = 2;
  uint64 workspace_revision = 3;
}

// ─── Recovery (OPT_RESYNC) ──────────────────────────────────────────

message ResyncWorkspace {
  bytes runtime_id = 1;
}

message StreamOverflow {
  bytes runtime_id = 1;
  optional bytes pane_id = 2;
  uint64 dropped_count = 3;
}

// ─── Scrollback (OPT_CHUNKED_SCROLLBACK) ─────────────────────────────

message GetScrollback {
  bytes runtime_id = 1;
  bytes pane_id = 2;
  uint64 offset = 3;
  uint32 limit = 4;
}

message ScrollbackChunk {
  bytes runtime_id = 1;
  bytes pane_id = 2;
  uint64 offset = 3;
  bytes data = 4;
  bool is_last = 5;
}

// ─── Diagnostics (OPT_DIAGNOSTICS) ──────────────────────────────────

message GetDiagnostics {}

message PaneDiagnosticsInfo {
  bytes id = 1;
  uint64 raw_bytes_len = 2;
  uint64 pending_flush_len = 3;
  bool is_exited = 4;
}

message WorkspaceDiagnosticsInfo {
  bytes id = 1;
  string name = 2;
  uint32 active_pane_count = 3;
  uint32 exited_pane_count = 4;
  reserved 5;  // was command_history_len (removed with RFC-031)
  uint32 attached_client_count = 6;
  repeated PaneDiagnosticsInfo panes = 7;
}

message DiagnosticsReport {
  uint32 workspace_count = 1;
  uint32 total_pane_count = 2;
  uint32 total_active_panes = 3;
  uint32 total_exited_panes = 4;
  uint32 client_count = 5;
  uint32 pty_writer_count = 6;
  uint64 total_raw_bytes = 7;
  uint64 total_pending_flush = 8;
  reserved 9;  // was total_command_history (removed with RFC-031)
  repeated WorkspaceDiagnosticsInfo workspaces = 10;
}

// ─── Errors ──────────────────────────────────────────────────────────

message ProtocolError {
  ErrorKind kind = 1;
  string message = 2;
  string operation = 3;
  bool retryable = 4;
  bool user_action_required = 5;
  uint32 retry_after_seconds = 6;
}

// ─── Envelopes ───────────────────────────────────────────────────────

message ClientEnvelope {
  uint64 request_id = 1;
  oneof command {
    // Terminal I/O (field 2: single-byte tag for highest-frequency path)
    TerminalInput terminal_input = 2;

    // Control
    Ping ping = 10;
    Shutdown shutdown = 11;

    // Workspace lifecycle
    CreateWorkspace create_workspace = 20;
    AttachWorkspace attach_workspace = 21;
    DetachWorkspace detach_workspace = 22;
    TerminateWorkspace terminate_workspace = 23;
    RenameWorkspace rename_workspace = 24;
    ListWorkspaces list_workspaces = 25;
    TakeoverWorkspace takeover_workspace = 26;  // OPT_WORKSPACE_TAKEOVER

    // Pane lifecycle
    CreatePane create_pane = 30;
    ClosePane close_pane = 31;
    ResizePane resize_pane = 32;
    SetPaneTitle set_pane_title = 33;
    SetPaneNoPersist set_pane_no_persist = 34;

    // Tree mutations (RFC-031 §5)
    SplitPane split_pane = 35;
    ResizeSplit resize_split = 36;

    // Viewport (RFC-031 §3–§5)
    SetFocus set_focus = 37;
    ReportClientSize report_client_size = 38;

    // Recovery (OPT_RESYNC)
    ResyncWorkspace resync_workspace = 50;

    // Scrollback (OPT_CHUNKED_SCROLLBACK)
    GetScrollback get_scrollback = 51;

    // Diagnostics (OPT_DIAGNOSTICS)
    GetDiagnostics get_diagnostics = 60;
  }
}

message ServerEnvelope {
  uint64 request_id = 1;
  oneof payload {
    // Terminal I/O (fields 2–3: single-byte tags for highest-frequency paths)
    OutputDelta output_delta = 2;
    TerminalModeChanged terminal_mode_changed = 3;

    // Control
    Pong pong = 10;

    // Workspace lifecycle events
    WorkspaceCreated workspace_created = 20;
    WorkspaceSnapshot workspace_snapshot = 21;
    WorkspaceDetached workspace_detached = 22;
    WorkspaceTerminated workspace_terminated = 23;
    WorkspaceRenamed workspace_renamed = 24;
    WorkspaceList workspace_list = 25;
    AttachBlocked attach_blocked = 26;
    TakeoverCompleted takeover_completed = 27;  // OPT_WORKSPACE_TAKEOVER
    LeaseLost lease_lost = 28;                  // OPT_WORKSPACE_TAKEOVER
    OwnerDisconnected owner_disconnected = 29;  // OPT_WORKSPACE_TAKEOVER

    // Pane lifecycle events
    PaneCreated pane_created = 30;
    PaneClosed pane_closed = 31;
    PaneResized pane_resized = 32;
    PaneExited pane_exited = 33;
    TitleChanged title_changed = 34;
    CwdChanged cwd_changed = 35;
    Bell bell = 36;

    // Tree mutation events (RFC-031 §5)
    PaneSplit pane_split = 37;
    SplitResized split_resized = 38;
    FocusChanged focus_changed = 39;

    // Recovery events (OPT_RESYNC)
    StreamOverflow stream_overflow = 50;

    // Scrollback response (OPT_CHUNKED_SCROLLBACK)
    ScrollbackChunk scrollback_chunk = 51;

    // Diagnostics response (OPT_DIAGNOSTICS)
    DiagnosticsReport diagnostics_report = 60;

    // Errors
    ProtocolError error = 100;
  }
}
