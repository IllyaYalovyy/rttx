[package]
name = "rttx-proto"
version.workspace = true
edition = "2024"
license.workspace = true

[dependencies]
prost = { version = "0.13", features = ["std", "prost-derive"] }
bytes = "1"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"

[dev-dependencies]
proptest = "1"

[build-dependencies]
prost-build = "0.13"
